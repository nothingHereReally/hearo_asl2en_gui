<div>
  <img class="
  logo-height-48px
  padding-left-right-pad100-lg
  padding-top-bottom-pad100-lg
  " src="/logo/hearo_logo.svg" alt="logo icon">
  <div class="flex-row flex-justify-center">
    <div
      class="
      flex-column
      gap-pad200-xs
      message-width-container
      padding-left-right-pad100-md
      padding-top-bottom-pad100-md
      background-color-tc1-900
      font-color-success
      border-radius
      "
      [hidden]="clerkPatientMsgReceivedSent().length==0">
      @for(el of clerkPatientMsgReceivedSent(); track $index){
          @if( el.user_a!=undefined ){
              <div class="width-100">
                <div class="flex-row"
                  [class.flex-justify-end]="clerkIs()=='user_a'">
                  <div class="a-message-width">
                    @if( clerkIs()=='user_a' ){ <span>Clerk: </span> }
                    @else{ <span>Patient: </span> }
                    <span> {{ el.user_a }}</span>
                  </div>
                </div>
              </div>
          }@else{
              <div class="width-100">
                <div class="flex-row"
                  [class.flex-justify-end]="clerkIs()=='user_b'">
                  <div class="a-message-width">
                    @if( clerkIs()=='user_b' ){ <span>Clerk: </span> }
                    @else{ <span>Patient: </span> }
                    <span> {{ el.user_b }}</span>
                  </div>
                </div>
              </div>
          }
      }
    </div>
  </div>
  <div class="
    flex-row
    flex-justify-center
    ">
      <textarea
          #inputMsg
          (input)="autoGrowHeightMsg(inputMsg)"
          class="
          background-color-pc3-800
          border-radius
          clerk-input-msg
          padding-left-right-pad100-lg
          padding-top-bottom-pad100-lg
          "
          name="clerk_message_in"
          placeholder="Your message"
          rows="1"
          [(ngModel)]="clerkInputMsg"
          (keydown)="sendMessage($event)">
      </textarea>
        <app-button
            [btnText]="'Send'"
            [styleButton]="'style-outline'"
            [isUnderlined]="'not-underlined'"
            (outOnClick)="sendMessage()"
            [iconname]="''"
            />
  </div>
</div>
