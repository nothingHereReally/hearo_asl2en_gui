<section class="
  flex-row
  flex-align-center
  flex-justify-start
  gap-pad200-md
  padding-left-right-pad100-md
  padding-top-bottom-pad100-md
  border-24r-1w-pc1-300color
  " aria-label="Recognition mode controls">
  <h2 class="font-bold-title">Sign recognition</h2>
  <fieldset class="
    flex-row
    flex-wrap-row
    flex-align-center
    gap-pad100-md
    padding-left-right-pad100-md
    padding-top-bottom-pad100-md
    border-pc1-300
    border-radius
    ">
    <!-- <legend class="font-bold-regular">Recognition mode</legend> -->
    <label class="flex-row flex-align-center gap-pad100-xs">
      <input
        type="radio"
        name="recognitionMode"
        [checked]="mode() === 'classic'"
        (change)="modeChange.emit('classic')">
      Classic
    </label>
    <label class="flex-row flex-align-center gap-pad100-xs">
      <input
        type="radio"
        name="recognitionMode"
        [checked]="mode() === 'exemplar'"
        (change)="modeChange.emit('exemplar')">
      Exemplar
    </label>
  </fieldset>
</section>
